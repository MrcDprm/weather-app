<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- seo -->
    <!-- Sunucu fonksiyonu (api/page.js) bu bölümü her adres için başlık, açıklama ve yapılandırılmış veriyle doldurur -->
    <title>Hava Durumu · Miraç Deprem</title>
    <meta name="robots" content="noindex" />
    <!-- /seo -->
    <meta name="theme-color" content="#e6f0ec" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/src/theme-init.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script defer src="https://nabiz.miracdeprem.com/js/nabiz.js" data-site="weather.miracdeprem.com"></script>
  </head>
  <body>
    <svg class="isobars" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
      <path d="M-20 92C160 40 420 30 640 72C820 106 960 190 1060 150C1160 110 1240 60 1300 76" />
      <path d="M-20 200C120 150 300 120 470 150C620 176 700 270 860 280C1000 288 1160 210 1300 200" />
      <path d="M-20 340C110 300 250 280 380 310C520 344 590 412 760 424C940 436 1140 360 1300 350" />
      <path d="M-20 480C150 450 330 430 520 462C700 492 820 540 1000 530C1120 524 1220 490 1300 480" />
      <path d="M710 112C760 58 870 48 940 82C1010 118 1004 190 930 214C850 240 740 224 710 174C698 152 698 128 710 112Z" />
      <path d="M760 126C796 96 870 92 906 116C940 140 932 174 890 186C840 200 776 190 758 162C750 148 752 136 760 126Z" />
      <text class="center-letter" id="center-letter" x="832" y="159"></text>
    </svg>

    <header class="topbar">
      <h1 data-i18n="title">Hava Durumu</h1>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <label class="sr-only" for="search" data-i18n="search"></label>
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4-4" />
        </svg>
        <input
          id="search"
          type="search"
          maxlength="80"
          spellcheck="false"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="search-results"
          data-i18n-placeholder="searchPlaceholder"
        />
        <ul class="results" id="search-results" role="listbox" data-i18n-aria="search" hidden></ul>
      </form>
      <div class="top-actions">
        <div class="segmented" role="group" data-i18n-aria="units">
          <button type="button" data-units="metric" data-i18n="unit_metric"></button>
          <button type="button" data-units="imperial" data-i18n="unit_imperial"></button>
        </div>
        <div class="lang-switch" role="group" data-i18n-aria="language">
          <button type="button" data-lang="tr">TR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button type="button" class="theme-button" id="theme-toggle"></button>
      </div>
    </header>

    <main class="page">
      <p class="notice" id="notice" role="status"></p>

      <!-- Ana sayfa: Türkiye haritası, kayıtlı şehirler, başkentler, son aramalar -->
      <section class="view" id="home-view">
        <h2 class="map-title" data-i18n="mapTitle"></h2>
        <p class="map-intro">
          <span data-i18n="tagline"></span>
          <button type="button" class="locate" id="locate" data-i18n="locate"></button>
        </p>
        <div class="map">
          <svg class="map-land" id="map-land" aria-hidden="true"></svg>
          <ul class="map-stations" id="map-stations" data-i18n-aria="mapTitle"></ul>
        </div>
        <p class="map-legend" data-i18n="stationLegend"></p>

        <section class="group group-narrow">
          <h2 class="group-title" data-i18n="bigCities"></h2>
          <ul class="stations" id="city-grid"></ul>
        </section>
        <section class="group" id="saved-group" hidden>
          <h2 class="group-title" data-i18n="savedCities"></h2>
          <ul class="stations" id="saved-grid"></ul>
        </section>
        <section class="group">
          <h2 class="group-title" data-i18n="worldCapitals"></h2>
          <ul class="stations" id="world-grid"></ul>
        </section>
        <section class="group" id="recent-group" hidden>
          <h2 class="group-title" data-i18n="recent"></h2>
          <ul class="chips" id="recent-list"></ul>
        </section>
      </section>

      <!-- Şehir ayrıntısı -->
      <section class="view" id="detail-view" hidden>
        <div class="detail-bar">
          <button type="button" class="btn btn-ghost" id="back">
            <span aria-hidden="true">←</span> <span data-i18n="back"></span>
          </button>
          <button type="button" class="btn save" id="save" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z" />
            </svg>
            <span id="save-label"></span>
          </button>
        </div>

        <p class="notice detail-status" id="detail-status" role="status"></p>
        <button type="button" class="btn retry" id="retry" data-i18n="retry" hidden></button>

        <div class="detail" id="detail" hidden>
          <article class="now">
            <div class="now-head">
              <h2 class="place-name" id="place-name" tabindex="-1"></h2>
              <p class="place-meta" id="place-meta"></p>
              <p class="now-temp" id="now-temp"></p>
            </div>
            <div class="now-sky">
              <svg class="wx-icon now-icon" id="now-icon" aria-hidden="true"></svg>
              <p class="now-desc" id="now-desc"></p>
            </div>
            <div class="now-station">
              <svg class="mark now-mark" id="now-mark" aria-hidden="true"></svg>
              <dl class="now-stats">
                <div><dt data-i18n="feelsLike"></dt><dd id="now-feels"></dd></div>
                <div><dt data-i18n="humidity"></dt><dd id="now-humidity"></dd></div>
                <div><dt data-i18n="wind"></dt><dd id="now-wind"></dd></div>
                <div><dt data-i18n="pressure"></dt><dd id="now-pressure"></dd></div>
              </dl>
            </div>
          </article>

          <svg class="front" aria-hidden="true">
            <defs>
              <pattern id="front-pattern" width="240" height="22" patternUnits="userSpaceOnUse">
                <path class="front-cold" d="M30 11L42 22L54 11Z" />
                <path class="front-warm" d="M90 11a12 11 0 0 1 24 0Z" />
                <path class="front-cold" d="M150 11L162 22L174 11Z" />
                <path class="front-warm" d="M210 11a12 11 0 0 1 24 0Z" />
              </pattern>
            </defs>
            <rect width="100%" height="22" fill="url(#front-pattern)" />
            <line class="front-line" x1="0" y1="11" x2="100%" y2="11" />
          </svg>

          <div class="below">
            <article>
              <h3 class="card-title" id="chart-title" data-i18n="next24"></h3>
              <p class="chart-legend" data-i18n="chartLegend"></p>
              <div class="chart-scroll">
                <svg class="chart" id="hour-chart" role="img" aria-labelledby="chart-title chart-summary"></svg>
              </div>
              <p class="sr-only" id="chart-summary"></p>
            </article>
            <article>
              <h3 class="card-title" data-i18n="forecast5"></h3>
              <ol class="days" id="days"></ol>
            </article>
          </div>
        </div>
      </section>
    </main>

    <dialog class="fb-dialog" id="fb-dialog" aria-labelledby="fb-title">
      <form class="fb-form" id="fb-form" novalidate>
        <h2 class="fb-title" id="fb-title" data-i18n="feedbackTitle"></h2>
        <p class="fb-intro" data-i18n="feedbackIntro"></p>
        <label class="fb-label" for="fb-name" data-i18n="feedbackName"></label>
        <input class="fb-input" id="fb-name" type="text" maxlength="100" autocomplete="name" />
        <label class="fb-label" for="fb-contact" data-i18n="feedbackContact"></label>
        <input class="fb-input" id="fb-contact" type="text" maxlength="255" autocomplete="email" required />
        <label class="fb-label" for="fb-message" data-i18n="feedbackMessage"></label>
        <textarea class="fb-input" id="fb-message" rows="4" maxlength="2000" required></textarea>
        <div class="fb-hp" aria-hidden="true">
          <label for="fb-website">Website</label>
          <input id="fb-website" type="text" tabindex="-1" autocomplete="off" />
        </div>
        <p class="fb-status" id="fb-status" role="status"></p>
        <div class="fb-actions">
          <button type="button" class="btn btn-ghost" id="fb-close" data-i18n="feedbackClose"></button>
          <button type="submit" class="btn btn-primary" id="fb-submit" data-i18n="feedbackSend"></button>
        </div>
      </form>
    </dialog>

    <footer class="footer">
      <button type="button" class="fb-open" id="fb-open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" /></svg>
        <span data-i18n="feedback"></span>
      </button>
      <p class="footer-owner">© <span id="footer-year">2026</span> Miraç Deprem</p>
      <!-- Veri lisansları atıf istiyor: Open-Meteo (CC BY 4.0), OpenStreetMap (ODbL) -->
      <p class="footer-credits">
        <a href="https://open-meteo.com/" data-i18n="dataSource"></a>,
        <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap</a>
      </p>
    </footer>

    <noscript><p class="noscript">Bu uygulama JavaScript gerektirir. · This app requires JavaScript.</p></noscript>
  </body>
</html>
